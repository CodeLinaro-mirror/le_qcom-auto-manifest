header:
  version: 12

machine: sa8797

target:
  - machine-image

distro: auto

bblayers_conf_header:
  standard: |
    SRC_TREE := "${@os.path.abspath(os.path.dirname(d.getVar('FILE', True)))}/../.."

    BBPATH = "${TOPDIR}"

    BBFILES = " \
    "


local_conf_header:
  standard: |
    VARIANT= "debug"
    CONF_VERSION = "2"
    BBMASK = ""


    # Create tarballs when pulling from a source control repository.
    BB_GENERATE_MIRROR_TARBALLS = "0"
    BB_GIT_VERBOSE_FETCH = "0"
    PATCHRESOLVE = "noop"
    BBMULTICONFIG = "qcom-guestvm"

    #Add prebuilt Variants to generate prebuilts.
    PREBUILT_VARIANTS = "HY11 HY22" 
    # Strip prebuilt packages
    PREBUILT_STRIP:${PN} = "1"

    RDEPENDS:packagegroup-qcom:remove = "packagegroup-qcom-ppat"

    #
    # Where to place downloads
    #
    # During a first build the system will download many differernt source code tarballs
    # from various upstream projects. This can take a while, particularly if your network
    # connection is slow. These are all stored in DL_DIR. When wiping and rebuilding you
    # can preserve this directory to speed up this part of subsequent builds. This directory
    # is safe to share between multiple builds on the same machine too.
    #
    # The default is a downloads directory under TOPDIR which is the build directory.
    #
    DL_DIR ?= "${TOPDIR}/downloads"


    #
    # Where to place shared-state files
    #
    # BitBake has the capability to accelerate builds based on previously built output.
    # This is done using "shared state" files which can be through of as cache objects
    # and this option determines where those files are placed.
    #
    # You can wipe out TMPDIR leaving this directory intact and the build would regenerate
    # from these files if no chages were made to the configuration. If changes were made
    # to the configuration, only shared state files where the state was still valid would
    # be used (done using checksums).
    #
    # The default is a sstate-cache directory under TOPDIR.
    #
    vim  ?= "${TOPDIR}/sstate-cache"

    # Setup default sstate-mirror based on bb env variable.

    #
    # Where to place the build output
    #
    # This option specifies where the bulk of the building work should be done and
    # where BitBake should place its temporary files and output. Keep in mind that
    # this includes the extraction and complation of many applications and the toolchain
    # which can use Gigabytes of hard disk space.
    #
    # The default is a tmp directory under TOPDIR.
    #
    TMPDIR = "${TOPDIR}/tmp"

    #
    # Default policy config
    #
    # The distribution setting controls which policy settings are used as defaults.
    #
    # DISTRO ??= ""

    #
    # Machine Selection
    #
    # MACHINE ??= ""

    #
    # Variant Selection
    #
    # VARIANT ??= ""

    # Show VARIANT in pre-build configuration output
    BUILDCFG_VARS += "VARIANT MACHINE_FEATURES"

    #
    # Package Management configuration
    #
    # This variable lists which packaging formats to enable. Multiple package backends
    # can be enabled at once and the first item listed in the variable will be used
    # to generate the root filesystems.
    # Options are:
    #  - 'package_deb' for debian style deb files
    #  - 'package_ipk' for ipk files are used by opkg (a debian style embedded package manager)
    #  - 'package_rpm' for rpm style packages
    # E.g.: PACKAGE_CLASSES ?= "package_rpm package_deb package_ipk"
    # PACKAGE_CLASSES ?= "package_ipk"
    PACKAGE_DEBUG_SPLIT_STYLE = ".debug"
    # EXTRA_IMAGE_FEATURES += " package-management"

    USER_CLASSES ?= "buildname"

    BUILDNAME = "${@get_tag('${SRC_DIR_ROOT}', d)}"


    TERMCMD = "${SCREEN_TERMCMD}"
    TERMCMDRUN = "${SCREEN_TERMCMDRUN}"
    # Allow not to use any bb in the following layers
    BBFILE_PATTERN_IGNORE_EMPTY_qti-bsp-prop = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_qcom = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_qcom-hwe = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_qcom-distro = "1"

    CONF_VERSION = "${@bb.utils.contains('LAYERSERIES_COMPAT_yocto', 'dunfell', '1', '2', d)}"

    
    BB_BASEHASH_IGNORE_VARS:append = " SRC_TREE KDIR WORKSPACE AUTOSOURCES PATH_TO_KERNEL BSPDIR BUILDNAME SRC_DIR_ROOT PATH_TO_REPO QTI_METAPATH_BASE QTI_METAPATH_BASE_PROP QTI_METAPATH_DISTRO \ "
    DISTRO_VERSION = "${BUILDNAME}"


    OPKG_ARGS:append = " --force-overwrite"

    BB_HASHSERVE = "auto"

    FETCHCMD_wget      = "/usr/bin/env wget    --retry-connrefused -t 5 -T 30 -nv --passive-ftp --no-check-certificate"
    FETCHCOMMAND_wget  = "/usr/bin/env wget    --retry-connrefused -t 5 -T 30 -nv --passive-ftp --no-check-certificate -P ${DL_DIR} ${URI}"
    RESUMECOMMAND_wget = "/usr/bin/env wget -c --retry-connrefused -t 5 -T 30 -nv --passive-ftp --no-check-certificate -P ${DL_DIR} ${URI}"

    export userfsdatadir = "${base_prefix}/data"
    PATH_TO_REPO ?= "git://${SRC_DIR_ROOT}"
    PROTO ?= "file"

    INHERIT += "qfile"
    SRC_DIR_ROOT = "${SRC_TREE}"
    export KDIR = "${STAGING_KERNEL_DIR}"
    INHERIT:remove = "rm_work"
    BB_SIGNATURE_HANDLER = "OEEquivHash"
    BBMULTICONFIG:remove = "qcom-guestvm"


    DISTRO = "auto"
    MACHINE = "sa8797"
    SDKMACHINE = "x86_64"
    DISTRO_VERSION = "1.0"
    DEBUG_BUILD = "0"
    PERFORMANCE_BUILD = "0"

    # Force error for dangling bbappends
    BB_DANGLINGAPPENDS_WARNONLY_forcevariable = "false"

    # Selected QCOM BSP
    QCOM_SELECTED_BSP = "custom"


